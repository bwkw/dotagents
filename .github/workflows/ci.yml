name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Shell syntax
        run: |
          for f in scripts/*.sh hooks/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: JS syntax
        run: node --check scripts/lib/merge-settings.mjs

      # The scripts and hooks run under whatever shell the agent invokes, and macOS ships bash 3.2.
      # A bash-4-only construct works fine in CI and fails silently on the machine that matters.
      - name: No bash 4+ constructs
        run: |
          if grep -rnE '^[^#]*\b(mapfile|readarray)\b|declare -A|\$\{[a-zA-Z_]+\^\^\}|\$\{[a-zA-Z_]+,,\}' scripts/ hooks/; then
            echo "::error::bash 4+ construct found; macOS ships bash 3.2"
            exit 1
          fi

      # verify-skills.sh checks frontmatter with targeted rules rather than a parser, which is fast
      # but not authoritative. Run a real one here: an unquoted ": " in a description once shipped a
      # skill whose frontmatter did not parse while every local check passed.
      - name: Frontmatter parses as YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = p.read_text()
              if not text.startswith("---"):
                  print(f"::error file={p}::no frontmatter"); bad = 1; continue
              try:
                  fm = yaml.safe_load(text.split("---", 2)[1]) or {}
              except yaml.YAMLError as e:
                  print(f"::error file={p}::frontmatter does not parse: {str(e).splitlines()[0]}")
                  bad = 1; continue
              for field in ("name", "description"):
                  if not fm.get(field):
                      print(f"::error file={p}::missing '{field}'"); bad = 1
          sys.exit(bad)
          PY

      - name: Skills lint
        run: ./scripts/verify-skills.sh

      - name: Verify-gate tests
        run: ./scripts/test-verify-gate.sh

      - name: Profiles are valid JSON and match the schema
        run: |
          for f in profiles/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
          node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of fs.readdirSync("profiles")) {
              if (!f.endsWith(".json") || f.startsWith("_")) continue;
              const p = JSON.parse(fs.readFileSync("profiles/" + f, "utf8"));
              if (!p.match?.remote) { console.error(`${f}: missing match.remote`); bad = 1; }
              for (const c of p.checks ?? []) {
                for (const k of ["id", "cmd", "gate", "agent_may_run"])
                  if (!(k in c)) { console.error(`${f}: check ${c.id ?? "?"} missing ${k}`); bad = 1; }
                // An unexplained request to run something by hand reads as arbitrary and gets ignored.
                if (c.agent_may_run === false && !c.delegate_reason) {
                  console.error(`${f}: check ${c.id} is delegated but has no delegate_reason`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          '

      # A dangling reference link makes the skill load but lose half its instructions, silently.
      # A link pointing outside the tree is worse: reference/ is read on instruction, so it turns
      # "read my notes" into "read whatever this points at".
      - name: Symlinks resolve and stay in-tree
        run: |
          bad=0
          root="$PWD"
          while IFS= read -r l; do
            if [ ! -e "$l" ]; then
              echo "::error file=$l::dangling symlink -> $(readlink "$l")"; bad=1; continue
            fi
            real="$(cd "$(dirname "$l")" && cd "$(dirname "$(readlink "$l")")" && pwd)"
            case "$real" in
              "$root"|"$root"/*) ;;
              *) echo "::error file=$l::symlink escapes the repository -> $real"; bad=1 ;;
            esac
          done < <(find skills -type l)
          exit $bad

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
