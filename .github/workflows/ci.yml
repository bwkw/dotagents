name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The README asks for node 18 or newer. That floor was claimed, never run: CI tested 22 only, so
  # "18 以上" was an unverified requirement being handed to people installing this. A floor nobody
  # exercises is a floor that has already moved.
  #
  # A separate job rather than a matrix dimension on `shell`, so the job names stay stable -- they are
  # the contexts the branch ruleset requires, and renaming them silently un-requires them.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Report the versions actually in use
        run: |
          node -v
          bash --version | head -1

      - name: All checks, on the oldest node we claim to support
        run: |
          node --check scripts/lib/merge-settings.mjs
          ./scripts/check.sh

  # Behaviour of the shell scripts, on both operating systems. Breakage has gone in both
  # directions: bash 4 constructs that pass on Linux and fail on macOS (which ships bash 3.2), and
  # `mktemp -t` spellings that work on BSD and fail on GNU coreutils. One OS catches neither.
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report the shell actually in use
        run: bash --version | head -1

      # Syntax, the bash-3.2 sweep, the skills lint and every behavioural suite, through the one
      # script you run locally -- so this job cannot drift from `./scripts/check.sh`.
      #
      # The `content` job below is CI-only, and saying so matters: it holds the authoritative YAML
      # parse and the profile schema validation, both of which need Python packages. Those are NOT
      # available offline and gate nothing locally. The claim used to be that local and CI could not
      # drift apart at all, which was false in seven steps' worth of ways.
      - name: All checks
        run: |
          node --check scripts/lib/merge-settings.mjs
          ./scripts/check.sh

      # printf, not echo: some shells expand the \n inside the JSON string literal and hand the
      # hook invalid JSON, which it correctly ignores -- making the test pass for the wrong reason.
      - name: Hooks answer in both dialects
        run: |
          set -e
          body='{"file_path":"/x/SKILL.md","content":"---\nname: no-description-here\n---\n"}'
          printf '{"hook_event_name":"PreToolUse","tool_name":"Write","tool_input":%s}' "$body" \
            | ./hooks/dotagents-lint-skill-frontmatter.sh | grep -q permissionDecision \
            || { echo "::error::Claude dialect not emitted"; exit 1; }
          printf '{"tool_name":"Write","tool_use_id":"a","tool_input":%s}' "$body" \
            | ./hooks/dotagents-lint-skill-frontmatter.sh | grep -q '"permission"' \
            || { echo "::error::Cursor dialect not emitted"; exit 1; }
          # Unparseable input must fall through open -- this hook only inspects.
          printf 'not json' | ./hooks/dotagents-lint-skill-frontmatter.sh | grep -qx '{}' \
            || { echo "::error::lint hook did not fail open on garbage"; exit 1; }

  # Content checks. Independent of the operating system, so they run once.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # CLAUDE.md must stay a symlink to AGENTS.md -- Claude Code does not read AGENTS.md, so if the
      # two become separate files the always-loaded layer drifts and nothing reports it. This broke
      # once: `perl -pi` on a symlink replaces it with a regular file, silently.
      - name: CLAUDE.md is still a symlink to AGENTS.md
        run: |
          mode="$(git ls-files -s CLAUDE.md | awk '{print $1}')"
          if [ "$mode" != "120000" ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md is mode $mode, not a symlink (120000). Restore it: rm CLAUDE.md && ln -s AGENTS.md CLAUDE.md"
            exit 1
          fi
          target="$(readlink CLAUDE.md)"
          if [ "$target" != "AGENTS.md" ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md points at '$target', expected AGENTS.md"
            exit 1
          fi

      # verify-skills.sh validates frontmatter with targeted rules rather than a parser, which is
      # fast but not authoritative. An unquoted ": " in a description once shipped a skill whose
      # frontmatter did not parse while every local check passed.
      - name: Frontmatter parses as YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = p.read_text()
              if not text.startswith("---"):
                  print(f"::error file={p}::no frontmatter"); bad = 1; continue
              try:
                  fm = yaml.safe_load(text.split("---", 2)[1]) or {}
              except yaml.YAMLError as e:
                  print(f"::error file={p}::frontmatter does not parse: {str(e).splitlines()[0]}")
                  bad = 1; continue
              for field in ("name", "description"):
                  if not fm.get(field):
                      print(f"::error file={p}::missing '{field}'"); bad = 1
          sys.exit(bad)
          PY

      # The schema expresses delegate_reason and scope/{files} structurally now, which only helps if
      # something actually validates against it.
      - name: Profiles satisfy the schema
        run: |
          pip install --quiet jsonschema
          python3 - <<'PY'
          import json, pathlib, sys, jsonschema
          schema = json.loads(pathlib.Path("profiles/_schema.json").read_text())
          bad = 0
          for f in sorted(pathlib.Path("profiles").glob("*.json")):
              if f.name == "_schema.json":
                  continue
              try:
                  jsonschema.validate(json.loads(f.read_text()), schema)
              except jsonschema.ValidationError as e:
                  print(f"::error file={f}::{e.message}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Profiles are valid and complete
        run: |
          node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of fs.readdirSync("profiles")) {
              if (!f.endsWith(".json")) continue;
              let p;
              try { p = JSON.parse(fs.readFileSync("profiles/" + f, "utf8")); }
              catch (e) { console.error(`${f}: invalid JSON -- ${e.message}`); bad = 1; continue; }
              if (f.startsWith("_")) continue;   // the schema is not a profile
              if (!p.match?.remote) { console.error(`${f}: missing match.remote`); bad = 1; }
              for (const c of p.checks ?? []) {
                for (const k of ["id", "cmd", "gate", "agent_may_run"])
                  if (!(k in c)) { console.error(`${f}: check ${c.id ?? "?"} missing ${k}`); bad = 1; }
                // An unexplained request to run something by hand reads as arbitrary, and gets ignored.
                if (c.agent_may_run === false && !c.delegate_reason) {
                  console.error(`${f}: check ${c.id} is delegated but has no delegate_reason`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          '

      # A dangling reference link makes a skill load but lose half its instructions, silently.
      # A link leaving the tree is worse: reference/ is read on instruction, so it turns
      # "read my notes" into "read whatever this points at".
      - name: Symlinks resolve and stay in-tree
        run: |
          bad=0
          root="$PWD"
          while IFS= read -r l; do
            if [ ! -e "$l" ]; then
              echo "::error file=$l::dangling symlink -> $(readlink "$l")"; bad=1; continue
            fi
            real="$(cd "$(dirname "$l")" && cd "$(dirname "$(readlink "$l")")" && pwd)"
            case "$real" in
              "$root"|"$root"/*) ;;
              *) echo "::error file=$l::symlink escapes the repository -> $real"; bad=1 ;;
            esac
          done < <(find skills -type l)
          exit $bad

      # Profiles name real repositories and environments and are gitignored. This repository's own
      # profile is the one exception -- public repo, public commands -- so it is allowlisted here
      # rather than by loosening the pattern.
      - name: No third-party profiles committed
        run: |
          leaked="$(git ls-files 'profiles/*.json' \
            | grep -v '^profiles/_' \
            | grep -v '^profiles/dotagents\.json$' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::tracked profile(s) that should be local: $leaked"
            exit 1
          fi

      # This profile gates the repository's own turns, so a break in it is felt only on a machine
      # that has the gate armed. CI checks it independently -- including that every check the agent
      # may run passes on a clean checkout, because a profile that always fails gets switched off.
      - name: This repository's own profile holds up
        run: |
          node -e '
            const { execSync } = require("child_process");
            const p = JSON.parse(require("fs").readFileSync("profiles/dotagents.json", "utf8"));
            if (!p.match || !String(p.match.remote).includes("dotagents")) {
              console.error("::error::match.remote does not point at this repository"); process.exit(1);
            }
            const gating = (p.checks || []).filter((c) => c.gate);
            if (!gating.length) { console.error("::error::no gating checks"); process.exit(1); }
            let bad = 0;
            for (const c of gating) {
              if (!c.agent_may_run) {
                if (!c.delegate_reason) { console.error(`::error::${c.id}: delegated without a reason`); bad = 1; }
                continue;
              }
              try { execSync(c.cmd, { stdio: "pipe" }); console.log("pass " + c.id); }
              catch (e) { console.error(`::error::profile check "${c.id}" fails on a clean checkout`); bad = 1; }
            }
            process.exit(bad);
          '

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
