name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Behaviour of the shell scripts, on both operating systems. Breakage has gone in both
  # directions: bash 4 constructs that pass on Linux and fail on macOS (which ships bash 3.2), and
  # `mktemp -t` spellings that work on BSD and fail on GNU coreutils. One OS catches neither.
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report the shell actually in use
        run: bash --version | head -1

      - name: Syntax
        run: |
          for f in scripts/*.sh hooks/*.sh; do bash -n "$f" || exit 1; done
          node --check scripts/lib/merge-settings.mjs

      - name: No bash 4+ constructs
        run: |
          if grep -rnE '^[^#]*\b(mapfile|readarray)\b|declare -A|\$\{[a-zA-Z_]+\^\^\}|\$\{[a-zA-Z_]+,,\}' scripts/ hooks/; then
            echo "::error::bash 4+ construct found; macOS ships bash 3.2"
            exit 1
          fi

      - name: Skills lint
        run: ./scripts/verify-skills.sh

      - name: Verify-gate tests
        run: ./scripts/test-verify-gate.sh

      # printf, not echo: some shells expand the \n inside the JSON string literal and hand the
      # hook invalid JSON, which it correctly ignores -- making the test pass for the wrong reason.
      - name: Hooks answer in both dialects
        run: |
          set -e
          body='{"file_path":"/x/SKILL.md","content":"---\nname: no-description-here\n---\n"}'
          printf '{"hook_event_name":"PreToolUse","tool_name":"Write","tool_input":%s}' "$body" \
            | ./hooks/dotagents-lint-skill-frontmatter.sh | grep -q permissionDecision \
            || { echo "::error::Claude dialect not emitted"; exit 1; }
          printf '{"tool_name":"Write","tool_use_id":"a","tool_input":%s}' "$body" \
            | ./hooks/dotagents-lint-skill-frontmatter.sh | grep -q '"permission"' \
            || { echo "::error::Cursor dialect not emitted"; exit 1; }
          # Unparseable input must fall through open -- this hook only inspects.
          printf 'not json' | ./hooks/dotagents-lint-skill-frontmatter.sh | grep -qx '{}' \
            || { echo "::error::lint hook did not fail open on garbage"; exit 1; }

  # Content checks. Independent of the operating system, so they run once.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # verify-skills.sh validates frontmatter with targeted rules rather than a parser, which is
      # fast but not authoritative. An unquoted ": " in a description once shipped a skill whose
      # frontmatter did not parse while every local check passed.
      - name: Frontmatter parses as YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = p.read_text()
              if not text.startswith("---"):
                  print(f"::error file={p}::no frontmatter"); bad = 1; continue
              try:
                  fm = yaml.safe_load(text.split("---", 2)[1]) or {}
              except yaml.YAMLError as e:
                  print(f"::error file={p}::frontmatter does not parse: {str(e).splitlines()[0]}")
                  bad = 1; continue
              for field in ("name", "description"):
                  if not fm.get(field):
                      print(f"::error file={p}::missing '{field}'"); bad = 1
          sys.exit(bad)
          PY

      - name: Profiles are valid and complete
        run: |
          node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of fs.readdirSync("profiles")) {
              if (!f.endsWith(".json")) continue;
              let p;
              try { p = JSON.parse(fs.readFileSync("profiles/" + f, "utf8")); }
              catch (e) { console.error(`${f}: invalid JSON -- ${e.message}`); bad = 1; continue; }
              if (f.startsWith("_")) continue;   // schema and example are not profiles
              if (!p.match?.remote) { console.error(`${f}: missing match.remote`); bad = 1; }
              for (const c of p.checks ?? []) {
                for (const k of ["id", "cmd", "gate", "agent_may_run"])
                  if (!(k in c)) { console.error(`${f}: check ${c.id ?? "?"} missing ${k}`); bad = 1; }
                // An unexplained request to run something by hand reads as arbitrary, and gets ignored.
                if (c.agent_may_run === false && !c.delegate_reason) {
                  console.error(`${f}: check ${c.id} is delegated but has no delegate_reason`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          '

      # A dangling reference link makes a skill load but lose half its instructions, silently.
      # A link leaving the tree is worse: reference/ is read on instruction, so it turns
      # "read my notes" into "read whatever this points at".
      - name: Symlinks resolve and stay in-tree
        run: |
          bad=0
          root="$PWD"
          while IFS= read -r l; do
            if [ ! -e "$l" ]; then
              echo "::error file=$l::dangling symlink -> $(readlink "$l")"; bad=1; continue
            fi
            real="$(cd "$(dirname "$l")" && cd "$(dirname "$(readlink "$l")")" && pwd)"
            case "$real" in
              "$root"|"$root"/*) ;;
              *) echo "::error file=$l::symlink escapes the repository -> $real"; bad=1 ;;
            esac
          done < <(find skills -type l)
          exit $bad

      # Profiles name real repositories and environments and are gitignored. If one is ever
      # committed, it should fail here rather than be noticed after it is public.
      - name: No real profiles committed
        run: |
          leaked="$(git ls-files 'profiles/*.json' | grep -v '^profiles/_' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::tracked profile(s) that should be local: $leaked"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
