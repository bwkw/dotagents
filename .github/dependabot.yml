version: 2

# ワークフローと、動画生成スキルのnpm依存を更新する。
# `npx skills` はREADME.mdと検査メッセージで手動ピンする。更新時はCLIの互換性も確認する。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /skills/da-demo-video
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3
